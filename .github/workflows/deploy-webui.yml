# Deploy static Web UI to GitHub Pages (see SETUP.md §5.2).
# Prerequisite: repository variable HOMEBOT_API_PUBLIC_URL (Settings → Secrets and variables → Actions → Variables).

name: Deploy Web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - ".github/workflows/deploy-webui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public API URL variable
        env:
          API_URL: ${{ vars.HOMEBOT_API_PUBLIC_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::HOMEBOT_API_PUBLIC_URL is not set. The build will use Vite defaults (often localhost), which is wrong for production Pages. Set the variable to your public API origin (no trailing slash)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install and build
        working-directory: webui
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.HOMEBOT_API_PUBLIC_URL }}
        run: npm ci && npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
